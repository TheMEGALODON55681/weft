[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weft"
version = "0.1.0"
description = "Goal-directed web crawler and in-site search, served to AI agents over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp",
    "httpx[http2]",
    "httpcore>=1.0,<1.1",
    "pydantic-settings",
    "selectolax",
    "trafilatura",
    "charset-normalizer",
    # Schema extraction: lxml runs the XPath rules, cssselect lets it run CSS rules on the same
    # tree, jsonschema validates the result. lxml arrives with trafilatura either way.
    "lxml",
    "cssselect",
    "jsonschema",
    # Pinned to one minor release: each one drives its own Chromium build, so an upgrade
    # means downloading a new browser. The browser itself is a separate download:
    # `playwright install chromium-headless-shell`.
    "playwright>=1.65.2,<1.66",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "cryptography",
    "ruff",
    "mypy",
]

[project.scripts]
weft = "weft.server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weft"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
# weft/__init__.py filters this for real runs, but pytest drops filters installed while it loads
# conftest, which now imports weft.
filterwarnings = ["ignore:SOCKS support in urllib3"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S104 flags "0.0.0.0" as a bind address; in the SSRF tests it is an address under test.
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
files = ["src/weft"]
strict = true

# These two ship no type information, and their stub packages lag the releases. The schema
# module keeps their results behind typed functions.
[[tool.mypy.overrides]]
module = ["jsonschema", "lxml", "lxml.*"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
# CurrentContext() is a dependency-injection marker, evaluated once at definition time on purpose.
extend-immutable-calls = ["fastmcp.dependencies.CurrentContext"]

[tool.ruff.format]
line-ending = "lf"
